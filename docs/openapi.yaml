openapi: 3.1.0
info:
  title: Wiki REST API
  version: "1.0.0"
  description: >
    Wiki システム用 REST API。
    ページ管理、アセット管理、ページロック（TTL/トークン）を提供する。
    2026-10-11のMS1時点では未対応・未検証だった。MS2〜4で実装し、MS5グループ2〜4で必要検証を完了。
    実行条件・制約は[検証観点・証拠参照](REST_API_AUTHORIZATION_TEST_VIEWPOINTS.md)を参照する。
    最終SC評価・CP5とは区別する。
    Wikiパスはraw検証後dotを解決する。root以外の末尾/、連続/、全角を含む空白・制御文字・バックスラッシュを拒否し、root越えを拒否する。
    rename_to/restore_toだけは末尾/（root自身を含む）で元のbasenameを一度付加し、元と最終配置先の双方を認可する。
    認可は返却・更新・lock cleanup・redirect・304より前。成立条件間では403、410、404の順とし、親候補非認可は404例外。
    Basic/Bearer双方の認証後公開要求は固定method/route templateで監査する。監査詳細はMCP_AUDIT_LOG_DESIGN.md第11節。
    認証方式として Basic 認証および Bearer 認証を受け付ける。
    x-required-scopeは単独操作では許可scopeのOR（write上位互換あり）。x-required-scope-by-actionがある共有POSTではactionごとの定義を優先し、x-required-scopeは候補集合であって全分岐をOR許可する意味ではない。
    Bearer 認証成功時にスライディング期限延長が発生した場合は、
    `X-Bearer-Expire` ヘッダで更新後の有効期限を返す。

servers:
  - url: /api

security:
  - basicAuth: []
  - bearerAuth: []

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    PageId:
      name: page_id
      in: path
      required: true
      schema: { type: string }

    AssetId:
      name: asset_id
      in: path
      required: true
      schema: { type: string }

    LockAuthHeader:
      name: X-Lock-Authentication
      in: header
      required: true
      schema: { type: string }
      description: 'token={lock_token}'

  schemas:
    ErrorResponse:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: 人間可読なエラー理由

    IdResponse:
      type: object
      required: [id]
      properties:
        id: { type: string }

    PagePath:
      type: object
      required: [path]
      properties:
        path: { type: string }

    LockInfo:
      type: object
      properties:
        expire:
          type: string
          format: date-time
        username:
          type: string

    AssetMeta:
      type: object
      properties:
        file_name: { type: string }
        mime_type: { type: string }
        size: { type: number }
        timestamp: { type: string }
        username: { type: string }

    PageListResponse:
      type: "object"
      required:
          - "items"
          - "has_more"
      properties:
        items:
          description: >-
            ページ情報のリストが格納される。
          type: "array"
          items:
            description: >-
              一件分のページ情報が格納される
            type: "object"
            required:
              - "page_id"
              - "path"
              - "deleted"
              - "last_update"
            properties:
              page_id:
                description: >-
                  ページIDが格納される
                type: "string"

              path:
                description: >-
                  ページの絶対パスが格納される。
                type: "string"

              deleted:
                description: >-
                  ページが削除されているか否かを表すフラグ値が格納される (削除されてい
                  る場合true)。
                type: "boolean"

              last_update:
                description: >-
                  最終更新情報をパックしたオブジェクトが格納される
                type: "object"
                required:
                  - "revision"
                  - "timestamp"
                  - "username"
                properties:
                  revision:
                    description: >-
                      リビジョン番号が格納される
                    type: "integer"

                  timestamp:
                    description: >-
                      更新日時が格納される(ISO8601,タイムゾーン無し)
                    type: "string"

                  username:
                    description: >-
                      更新を行ったユーザの名前が格納される
                    type: "string"

        has_more:
          description: >-
            同じ方向で継続して一覧取得可能か否かを表すフラグ値が格納される (trueの場合、
            継続して一覧取得が可能)。
          type: "boolean"

        anchor:
          description: >-
            次回の forward / rewind に指定すべきカーソル値 (has_moreがtrueの場合のみ格
            納される)。
          type: "string"

    PageShortResponse:
      type: "object"
      required:
        - short_path
      properties:
        short_path:
          description: >-
            指定された正規化済みページパスに対応する短縮用パス断片 `{short_id}` が格納される。
            実際の短縮URLを構成する場合はクライアント側で `/w/` を前置する
          type: "string"

    DeletedPageCandidates:
      type: "array"
      items:
        type: "string"

    TemplateCandidates:
      type: "array"
      items:
        type: "object"
        required:
          - "page_id"
          - "name"
        properties:
          page_id:
            description: >-
              テンプレートページのページIDが格納される
            type: "string"

          name:
            description: >-
              テンプレート候補の表示名が格納される
            type: "string"

          description:
            description: >-
              テンプレート候補の補助説明が格納される
            type: "string"

          macro_expand:
            description: >-
              テンプレート適用時の展開挙動フラグが格納される
            type: "boolean"

    PageSearchResults:
      type: "array"
      items:
        description: >-
          検索にマッチしたページの情報が格納される。
        type: "object"
        required:
          - "page_id"
          - "revision"
          - "score"
          - "path"
          - "deleted"
          - "text"
        properties:
          page_id:
            description: >-
              ページIDが格納される
            type: "string"

          revision:
            description: >-
              リビジョン番号が格納される。
            type: "integer"

          score:
            description: >-
              検索スコアが格納される。
            type: "number"

          path:
            description: >-
              ページのパスが格納される。
            type: "string"

          deleted:
            description: >-
              ページが削除されているか否かを表すフラグ値が格納される(削除されている場合true)。
            type: "boolean"
          text:
            description: >-
              検索式にマッチした周辺を含んだスニペットテキストが格納される。
            type: "string"
      maxItems: 100

    ParentPageResponse:
      type: "object"
      required:
        - id
        - path
      properties:
        id:
          description: >-
            親ページのページIDが格納される
          type: "string"
        path:
          description: >-
            親ページのパスが格納される
          type: "string"

  responses:
    Unauthorized:
      description: 認証に失敗した
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: 認証済みだが必要スコープ、ReadOnly、操作条件またはBearer path prefix制約を満たさない（返却親の非認可404は例外）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

paths:
  "/pages":
    get:
      summary: ページ一覧
      description: Bearer 認証時は `read` スコープが必要。要求prefix自体を認可。cursorは比較用で独立認可せず、結果・件数・anchorはprefix内で算出。
      x-required-scope: [read]
      parameters:
        - name: prefix
          in: query
          description: REQUIREMENTS.md 2.2のraw検証・dot解決・最終検証を行う絶対Wikiパス
          required: true
          schema: { type: string }
        - name: forward
          in: query
          description: REQUIREMENTS.md 2.2のraw検証・dot解決・最終検証を行う絶対Wikiパス
          required: false
          schema: { type: string }
        - name: rewind
          in: query
          description: REQUIREMENTS.md 2.2のraw検証・dot解決・最終検証を行う絶対Wikiパス
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
        - name: with_deleted
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageListResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: 入力形式不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      summary: ページの作成
      description: Bearer 認証時は `create` スコープが必要
      x-required-scope: [create]
      parameters:
        - name: path
          in: query
          description: REQUIREMENTS.md 2.2のraw検証・dot解決・最終検証を行う絶対Wikiパス
          required: true
          schema: { type: string }
      responses:
        "201":
          description: 作成成功
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: パス不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: 既存ページあり
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  "/pages/{page_id}/source":
    get:
      summary: ページソース取得
      description: Bearer 認証時は `read` スコープが必要
      x-required-scope: [read]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - name: rev
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Markdown ソース
          headers:
            Cache-Control: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            text/markdown:
              schema: { type: string }
        "304":
          description: Not Modified
          headers:
            Cache-Control: { schema: { type: string } }
            ETag: { schema: { type: string } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: rev 不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: ページ/リビジョン不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      summary: ページソース更新
      description: Bearer 認証時は `update` スコープが必要。ロックされているページでは `X-Lock-Authentication` も必要
      x-required-scope: [update]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - name: amend
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/LockAuthHeader"
      requestBody:
        required: true
        content:
          text/markdown:
            schema: { type: string }
      responses:
        "204":
          description: 更新成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          description: amend 不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: 権限/トークン不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: ページ不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 削除済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "423":
          description: ロック中（トークン未指定）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  "/pages/{page_id}/meta":
    get:
      summary: ページメタ情報取得
      description: Bearer 認証時は `read` スコープが必要
      x-required-scope: [read]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - name: rev
          in: query
          schema: { type: number }
      responses:
        "200":
          description: メタ情報
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: rev 不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: ページ/リビジョン不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  "/pages/{page_id}/path":
    get:
      summary: ページパス取得
      description: Bearer 認証時は `read` スコープが必要
      x-required-scope: [read]
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: ページパス
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagePath" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: ページ不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      summary: ページパス更新
      description: rename_to または restore_to のいずれかを指定する。末尾/およびroot /は元のbasenameを付加した最終配置先となり、元と先の双方を認可する。Bearer 認証時はrenameが`update`、restoreが`create`を要求する
      x-required-scope: [update, create]
      x-required-scope-by-action:
        rename: [update]
        restore: [create]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - name: rename_to
          in: query
          required: false
          schema: { type: string }
        - name: restore_to
          in: query
          required: false
          schema: { type: string }
        - name: recursive
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "204":
          description: リネーム成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: パス不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: ページ不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: パス競合
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 削除済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "423":
          description: ロック中
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  "/pages/{page_id}/assets":
    get:
      summary: ページ配下アセット一覧
      description: Bearer 認証時は `read` スコープが必要
      x-required-scope: [read]
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: アセット一覧
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssetMeta" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: ページ不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  "/pages/{page_id}/assets/{file_name}":
    post:
      summary: アセットアップロード（ページ指定）
      description: Bearer 認証時は `update` スコープが必要。ロックされているページでは `X-Lock-Authentication` も必要
      x-required-scope: [update]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - name: file_name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: アップロード成功
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: パラメータ不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: ページ不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: ファイル重複
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 削除済みページ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      summary: アセット取得リダイレクト（ページ指定）
      description: Bearer 認証時は `read` スコープが必要
      x-required-scope: [read]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - name: file_name
          in: path
          required: true
          schema: { type: string }
      responses:
        "302":
          description: リダイレクト
          headers:
            Location: { schema: { type: string } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: パラメータ不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: ページ/アセット不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 削除済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  "/pages/{page_id}/lock":
    post:
      summary: ページロック取得
      description: Bearer 認証時は `create` または `update` スコープが必要
      x-required-scope: [create, update]
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "204":
          description: ロック成功
          headers:
            X-Page-Lock: { schema: { type: string } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: ページ不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: 既にロック中
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 削除済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    put:
      summary: ページロック延長
      description: Bearer 認証時は `create` または `update` スコープが必要。`X-Lock-Authentication` が必要
      x-required-scope: [create, update]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/LockAuthHeader"
      responses:
        "204":
          description: 延長成功
          headers:
            X-Page-Lock: { schema: { type: string } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: トークン不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: ロックなし/ページ不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 削除済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      summary: ロック状態取得
      description: Bearer 認証時は `read` スコープが必要
      x-required-scope: [read]
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: ロック情報
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockInfo" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: ロックなし/ページ不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 削除済み
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      summary: ページロック解除
      description: Bearer 認証時は `update` スコープが必要。`X-Lock-Authentication` が必要
      x-required-scope: [update]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/LockAuthHeader"
      responses:
        "204":
          description: 解除成功
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: トークン不正
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: ロックなし/ページ不存在
          content:
            application/json:
